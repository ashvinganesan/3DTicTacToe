<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./vendor/three.min.js?v=2"></script>
    <script>
      if (typeof window.THREE === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js';
        document.head.appendChild(s);
      }
    </script>
    <script src="./app/app.js?v=2"></script>
    <script>
      // Ensure exports are available on window for easy access
      (function(){
        if (typeof window.$rt_exports !== 'undefined') {
          if (typeof window.ttt_bestMove === 'undefined' && typeof window.$rt_exports.ttt_bestMove === 'function') {
            window.ttt_bestMove = window.$rt_exports.ttt_bestMove;
          }
          if (typeof window.ttt_apply === 'undefined' && typeof window.$rt_exports.ttt_apply === 'function') {
            window.ttt_apply = window.$rt_exports.ttt_apply;
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="ui">
      <div id="status">Turn: X</div>
      <button id="reset">Reset</button>
      <button id="aiToggle" title="Toggle AI (O)">AI: Off</button>
      <a id="back" href="/" title="Back to Games">← Back</a>
    </div>
    <div id="app"></div>
    <script src="./main.js?v=2"></script>
  </body>
  </html>
